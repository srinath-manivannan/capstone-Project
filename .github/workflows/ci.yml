# ============================================
# 📄 WHAT : The CI pipeline — GitHub Actions runs this on every push & PR.
# 🎯 WHY  : Re-runs ALL quality gates on a clean cloud machine, so "works on
#           my machine" can never merge. Green checks = safe to merge.
# 🔁 FLOW : git push ➜ THIS FILE ➜ jobs run in parallel ➜ ✅/❌ on the PR
#           (full explanation: DEVOPS-GUIDE.md §5)
# ============================================
name: CI

# WHEN to run: every push to main, and every PR that wants to merge into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- JOB 1: the backend ----------
  backend:
    runs-on: ubuntu-latest # a fresh, throwaway Linux VM
    defaults:
      run:
        working-directory: backend # every `run:` below happens inside backend/
    steps:
      # Step 1: download the repo's code onto the VM
      - uses: actions/checkout@v4

      # Step 2: install Node 20, and cache npm downloads keyed on the lockfile
      # (cache hit = installs finish in seconds instead of minutes)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Step 3: clean install EXACTLY from package-lock.json.
      # 💬 INTERVIEW: always `npm ci` in CI, never `npm install` —
      # ci is reproducible and fails loudly if the lockfile is out of sync.
      - run: npm ci

      # Step 4: Gate 3 — the type check
      - run: npm run typecheck

      # Step 5: Gate 4 — prove it compiles to dist/
      - run: npm run build

  # ---------- JOB 2: the frontend (runs IN PARALLEL with backend) ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Gate 2 — the linter
      - run: npm run lint

      # Gates 3+4 — `build` runs tsc first, then the Vite production build
      - run: npm run build

# NOTE on secrets: this pipeline needs none (no deploy step yet). When you add
# CD, put credentials in repo Settings → Secrets and use:
#   env:
#     SOME_TOKEN: ${{ secrets.SOME_TOKEN }}
# Never paste a secret into this file.
